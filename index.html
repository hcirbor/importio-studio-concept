function freshWorkflow(kind='research',scenario='single'){const s=scenarios[scenario];state.kind=kind;state.route=kind;state.authoring='guided';state.inputMode='paste';state.stage=0;state.scenario=scenario;state.workflow={name:'',version:1,sources:[],goal:'',schema:[],limits:{pages:kind==='collect'?30:6,minutes:kind==='research'?6:3}};state.run=structuredClone(baseState.run);state.result={records:[],unresolved:[]};state.saved=false;state.dirty=false;state.ui={...baseState.ui};persist();render();scrollTo({top:0,behavior:reduced?'auto':'smooth'})}
function applyScenario(id){const s=scenarios[id];previousDraft=structuredClone(state.workflow);state.scenario=id;if(id==='prompt')state.authoring='prompt';state.kind=s.kind;state.route=s.kind;state.workflow={name:s.name,version:1,sources:[...s.sources],goal:s.goal,schema:s.schema.map(x=>[...x]),limits:{...s.limits}};state.dirty=true;toast('Template applied',true);persist(true);render()}
function statusChip(label){return `<span class="status ${STATUS[label]||'neutral'}">${label}</span>`}
function navLink(route,label){const current=(state.route===route||(route==='datasets'&&state.route==='enrichment-detail'))?'page':false;return `<a href="#${route}" ${current?`aria-current="${current}"`:''} data-route="${route}">${label}</a>`}
function selectMarkup(name,value,options,label=name){return `<div class="custom-select" data-select="${name}"><button class="select-button" type="button" aria-haspopup="listbox" aria-expanded="false"><span>${value}</span><span>⌄</span></button><div class="select-list" role="listbox" aria-label="${label}">${options.map(o=>`<button type="button" role="option" data-value="${o}" aria-selected="${o===value}">${o}</button>`).join('')}</div></div>`}
function shell(content,title='Home'){return `<div class="scrim ${state.ui.nav?'show':''}" data-action="close-nav"></div><aside class="rail ${state.ui.nav?'open':''}" aria-label="Primary"><div class="brand">import.io</div><div class="workspace"><b>Import.io Studio</b><span>Concept workspace</span></div><nav><div class="nav-label">Workspace</div>${navLink('home','⌂ Home')}<div class="nav-label">Build</div><button class="nav-link" data-action="new-workflow">＋ New workflow</button><div class="nav-label">Operate</div>${navLink('pipelines','▤ Pipelines')}${navLink('runs','◷ Runs')}${navLink('datasets','▦ Datasets')}${navLink('monitors','⌁ Monitors')}<div class="nav-label">Reference</div>${navLink('api','‹› Developers')}${navLink('webhooks','▣ Webhooks')}${navLink('usage','▥ Usage')}</nav><div class="rail-spacer"></div><div class="profile"><span class="avatar">DU</span><div><b>Demo User</b><span>Concept workspace</span></div></div></aside><div class="shell"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="button menu-button" data-action="open-nav">Menu</button><div class="crumb">Studio&nbsp; / &nbsp;<b>${title}</b></div></div><div class="top-actions"><span class="demo">INTERACTIVE DEMO</span>${selectMarkup('theme',document.documentElement.dataset.themePreference||'system',['system','light','dark'],'Theme')}</div></header><main class="main" id="main">${content}</main></div>`}
function heading(eyebrow,title,desc,actions=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div>${actions}</div>`}
function home(){const fresh=new URLSearchParams(location.hash.split('?')[1]||'').get('fresh')==='1';const hero=fresh?`<section class="hero"><div><div class="eyebrow">Your web data workspace</div><h1>From web pages<br>to data you can trust.</h1><p>Describe the outcome. Studio plans and performs the web work, then returns structured records with the evidence close at hand.</p></div><div class="hero-graphic"><i class="node a"></i><i class="node b"></i><i class="node c"></i><i class="hub">✓</i><i class="node d"></i><i class="node e"></i><i class="node f"></i></div></section>`:'';const attention=`<section class="section"><div class="section-title"><h2>Needs attention</h2><span class="mono">2 items</span></div><div class="attention-grid"><div class="card"><b>Supplier dataset · 2 unresolved fields</b><p class="muted">Review evidence before using this output.</p><button class="button" data-action="review-dataset">Review data</button></div><div class="card"><b>Retailer profile needs reconnecting</b><p class="muted">The saved browser profile needs a local mock re-authentication.</p><button class="button" data-action="reconnect">Reconnect</button></div></div></section>`;const recent=`<section class="section"><div class="section-title"><h2>Recent pipelines</h2><a href="#pipelines">View all</a></div><div class="panel table-wrap"><table><thead><tr><th>Pipeline</th><th>Version</th><th>Status</th><th>Last run</th></tr></thead><tbody><tr data-go="pipeline-detail"><td>${state.saved?state.workflow.name:'Competitor prices'}</td><td>v${state.saved?state.workflow.version:4}</td><td>${statusChip('Healthy')}</td><td>18 min ago</td></tr><tr data-go="pipeline-detail"><td>Qualified suppliers</td><td>v2</td><td>${statusChip('Needs review')}</td><td>Yesterday</td></tr></tbody></table></div></section>`;const cards=Object.entries(kinds).map(([k,d])=>`<article class="card start-card"><span class="icon">${{research:'⌕',extract:'↳',collect:'▦',monitor:'⌁'}[k]}</span><h3>${d.title}</h3><p>${d.desc}</p><button class="button" data-start="${k}">${k==='monitor'?'Choose pipeline':'Start '+d.title.toLowerCase()}</button></article>`).join('');return shell(`${hero}${fresh?'':attention+recent}<section class="section"><div class="section-title"><h2>What would you like to do?</h2><span class="eyebrow">Start with a workflow</span></div><div class="start-grid">${cards}</div></section><section class="section support-grid"><div class="card"><div class="eyebrow">Developers</div><h2>Use reviewed pipelines from your agent</h2><p class="muted">Connect through API or MCP with the same evidence-backed workflow.</p><a href="#api">Open Developers</a></div><div class="card"><div class="eyebrow">Evidence</div><h2>Every value stays traceable</h2><p class="muted">Capture source pages, field-level support and unresolved values.</p><a href="#datasets">Review datasets</a></div></section>`,'Home')}
function stepper(){const labels=['Describe','Review plan','Watch run','Review data'];return `<nav class="stepper" aria-label="Workflow progress">${labels.map((l,i)=>`${i?'<i class="step-line"></i>':''}<button class="step" data-stage="${i}" ${i===state.stage?'aria-current="step"':''} ${i>state.stage?'disabled':''}><i>${i+1}</i><span>${l}</span></button>`).join('')}</nav>`}
function workflow(){const k=kinds[state.kind];return shell(`<a href="#home">← Home</a>${heading('Build',k.title,k.desc)}${stepper()}${state.ui.discard?`<div class="inline-banner discard" role="alert">Discard current draft?<button class="button danger" data-action="discard">Discard</button><button class="button" data-action="keep">Keep editing</button></div>`:''}<div id="workflow-stage">${[describe,plan,watch,result][state.stage]()}</div>`,k.title)}
function describe(){const untouched=!state.dirty&&!state.workflow.goal;return `<div class="grid-2"><section class="panel composer"><div class="composer-top"><div><h2>How do you want to describe the work?</h2><p class="muted">Use guided fields or paste a complete agent prompt.</p></div><div class="authoring" role="tablist" aria-label="Authoring mode"><button role="tab" aria-selected="${state.authoring==='guided'}" tabindex="${state.authoring==='guided'?0:-1}" data-authoring="guided">Guided setup</button><button role="tab" aria-selected="${state.authoring==='prompt'}" tabindex="${state.authoring==='prompt'?0:-1}" data-authoring="prompt">Full prompt</button></div></div>${state.authoring==='prompt'?`<div class="field"><label class="field-label" for="prompt">What should Import.io do?</label><textarea id="prompt" aria-describedby="goal-error" placeholder="Describe sources, navigation, fields, limits and missing-data rules…">${escapeHtml(state.workflow.goal)}</textarea><div class="field-error" id="goal-error" role="alert"></div></div>`:`<div class="field"><label class="field-label" for="sources">Source URLs or domains</label><textarea id="sources" aria-describedby="sources-error" placeholder="https://example.com/page">${escapeHtml(state.workflow.sources.join('\n'))}</textarea><div class="field-error" id="sources-error" role="alert"></div></div><div class="field"><label class="field-label" for="goal">What do you want to know?</label><textarea id="goal" aria-describedby="goal-error" placeholder="Describe the outcome and requested fields…">${escapeHtml(state.workflow.goal)}</textarea><div class="field-error" id="goal-error" role="alert"></div></div>`}<div class="composer-tools"><button class="tool" data-action="inputs" aria-expanded="${state.ui.inputsOpen}">＋ Inputs · ${state.workflow.sources.length}</button><button class="tool" data-action="example">☷ Example</button></div>${state.ui.inputsOpen?inputsPopover():''}<div class="composer-actions"><span class="muted">Free preview · ≤ ${state.workflow.limits.pages} pages · ≤ ${state.workflow.limits.minutes} min</span><button class="button primary" data-action="plan">Plan workflow</button></div></section><aside class="card"><div class="eyebrow">Start from a template</div><h2>Use a familiar job</h2><p class="muted">Templates replace an untouched request. Edited work can be restored with Undo.</p><div class="template-list">${untouched?`<button class="template" data-template="batch"><b>Research pricing across domains</b><small>Batch discovery with nested plans and evidence.</small></button><button class="template" data-template="single"><b>Compare competitor prices</b><small>One verified row per seller.</small></button><button class="template" data-template="prompt"><b>Find qualified suppliers</b><small>Public-directory candidates with evidence.</small></button>`:''}</div><p class="muted">Free preview within the stated page and time caps.</p></aside></div>`}
function inputsPopover(){return `<div class="popover"><div class="input-options">${[['paste','URLs or domains','Paste a list'],['csv','Upload CSV','Map a source column'],['dataset','Existing dataset','Enrich selected rows'],['runtime','API at runtime','Supply values later'],['discover','Discover live web','Find candidate pages'],['prior','Prior research','Reuse and re-verify']].map(x=>`<button class="input-option" data-input="${x[0]}"><b>${x[1]}</b><small>${x[2]}</small></button>`).join('')}</div>${state.inputMode==='csv'?`<div class="field" style="margin-top:12px"><label class="field-label" for="csv">Choose CSV</label><input id="csv" type="file" accept=".csv,text/csv"><div id="csv-info" class="muted">Choose a file, then map its source column.</div></div>`:''}</div>`}
function planSteps(){const n=state.workflow.sources.length||1,k=state.kind;if(state.scenario==='batch')return [['Open 20 domains in bounded workers','20 inputs'],['Locate pricing pages and entry plans','≤ 60 pages'],['Extract companies and nested plans','20 records'],['Explain gaps and retain evidence','strict']];if(state.scenario==='prompt')return [['Open the public member directory','1 directory'],['Visit candidate detail pages','≤ 18 pages'],['Deduplicate qualified businesses','≤ 6 records'],['Explain unavailable values','use null']];if(k==='extract')return [['Render the source page','1 URL'],['Extract the requested fields','1 record'],['Validate types and evidence','strict']];if(k==='collect')return [['Open the starting category','1 URL'],['Follow pagination within the page cap',`≤ ${state.workflow.limits.pages} pages`],['Extract each item and deduplicate','typed records']];if(k==='monitor')return [['Open the pipeline source','1 URL'],['Extract and validate tracked fields','typed values'],['Set the reviewed baseline','1 baseline']];return [['Open the supplied sources',`${n} source${n===1?'':'s'}`],['Locate the requested facts','bounded'],['Extract one record per source',`${n} record${n===1?'':'s'}`],['Explain gaps and retain evidence','strict']]}
function schemaRows(){return state.workflow.schema.map((f,i)=>`<div class="schema-row" data-schema-row="${i}"><input aria-label="Field name" value="${f[0]}"><select aria-label="Field type">${['text','number','integer','boolean','date','url','currency code','enum','object','array'].map(t=>`<option ${t===f[1]?'selected':''}>${t}</option>`).join('')}</select><label class="toggle"><input type="checkbox" ${f[2]?'checked':''}> Required</label><label class="toggle"><input type="checkbox" ${f[3]?'checked':''}> Nullable</label><button class="button" data-remove-field="${i}" aria-label="Remove ${f[0]}">×</button><details><summary>Description${['object','array'].includes(f[1])?' and child fields':''}</summary><input aria-label="Field description" placeholder="What this field contains">${f[0]==='plans'?'<div class="schema"><div class="schema-row"><input aria-label="Child field name" value="name"><span class="status">text</span></div><div class="schema-row"><input aria-label="Child field name" value="price"><span class="status">number</span></div><div class="schema-row"><input aria-label="Child field name" value="billing_period"><span class="status">text</span></div></div>':''}</details></div>`).join('')}
function plan(){if(!state.workflow.name)state.workflow.name=scenarios[state.scenario]?.name||`${kinds[state.kind].title} workflow`;return `<section class="panel"><div class="panel-head"><div><div class="eyebrow">Review plan</div><h2>Plan, schema and limits</h2></div><span class="muted">Free preview · ≤ ${state.workflow.limits.pages} pages · ≤ ${state.workflow.limits.minutes} min</span></div><div class="composer"><div class="field"><label class="field-label" for="workflow-name">Workflow name</label><input id="workflow-name" value="${escapeHtml(state.workflow.name)}"><small class="muted">Suggested from the interpreted request · editable</small></div><div class="plan-list">${planSteps().map((x,i)=>`<div class="plan-step"><span>${String(i+1).padStart(2,'0')}</span><div><b>${x[0]}</b><small>${i===0?'Final URLs and captures are retained.':'Generated from the current request and kind.'}</small></div><code>${x[1]}</code></div>`).join('')}</div><details class="settings" open><summary>Expected output schema</summary><div class="schema">${schemaRows()}<button class="button" data-action="add-field">＋ Add field</button></div></details><details class="settings"><summary>Limits and access</summary><div class="settings-grid"><label class="field-label">Page cap<input class="control" id="page-cap" type="number" min="1" value="${state.workflow.limits.pages}"></label><label class="field-label">Time cap (min)<input class="control" id="time-cap" type="number" min="1" value="${state.workflow.limits.minutes}"></label><label class="field-label">Browser profile${selectMarkup('access','No saved profile',['No saved profile','Retailer profile','Supplier profile'],'Browser profile')}</label></div></details><div class="flow-actions"><button class="button" data-stage="0">Edit request</button><button class="button primary" data-action="run">Run free preview</button></div></div></section>`}
function seedRun(){const count=state.scenario==='batch'?20:state.scenario==='prompt'?6:1;state.run={id:'run_'+Math.random().toString(36).slice(2,6),status:'Running',progress:40,workers:Array.from({length:Math.min(count,4)},(_,i)=>({name:`Worker ${i+1}`,status:i===0?'Completed':i===1?'Running':'Queued'})),records:makeRecords(count).slice(0,1),events:[{t:'00:00',title:'Run queued',detail:'Free preview started.'},{t:'00:03',title:'Opened first source',detail:'Rendered and retained a capture.'}],failed:0,needsInput:0};state.result={records:[],unresolved:[]}}
function makeRecords(n){const base=state.scenario==='prompt'?['North Star Roofing','Prairie Roof Co.','Worthington Exteriors','Lakeside Roofing','Red River Roofers','Summit Roofing']:state.scenario==='batch'?Array.from({length:20},(_,i)=>`SaaS Company ${i+1}`):['Northwind Outdoors'];return base.slice(0,n).map((name,i)=>({name,product:state.scenario==='single'?'Trailhead 2P':'Starter plan',price:i===2?null:49+i*10,availability:i===0?'In stock':i===2?'Unknown':'Available',evidence:2,manual:false}))}
function ensureDataset(){if(state.result.records.length)return;state.result.records=[{name:'North Star Roofing',product:'Roofing services',price:null,availability:'Unknown',evidence:2,manual:false},{name:'Prairie Roof Co.',product:'Residential roofing',price:null,availability:'Available',evidence:2,manual:false}];state.result.unresolved=[{record:0,field:'availability',reason:'Value was not visible',resolved:false}]}
function advanceRun(){if(runTimer)clearInterval(runTimer);const total=state.scenario==='batch'?20:state.scenario==='prompt'?6:1,steps=[55,72,88,100],tick=()=>{const p=steps.shift();if(p==null)return;state.run.progress=p;const done=Math.min(state.run.workers.length,Math.max(1,Math.floor(p/25)));state.run.workers=state.run.workers.map((w,i)=>({...w,status:i<done?'Completed':i===done?'Running':'Queued'}));state.run.records=makeRecords(Math.max(1,Math.ceil(total*p/100)));state.run.events.push({t:'00:'+String(state.run.events.length*3).padStart(2,'0'),title:p===100?'Preview ready for review':`Processed ${state.run.records.length} record${state.run.records.length===1?'':'s'}`,detail:p===100?'One or more values may still need review.':'Evidence captured from visible page content.'});if(p===100){state.run.status='Needs review';state.result.records=[...state.run.records];const idx=Math.min(2,state.result.records.length-1);if(idx>=0){state.result.records[idx].availability='Unknown';state.result.unresolved=[{record:idx,field:'availability',reason:'Value was not visible',resolved:false}]}clearInterval(runTimer);runTimer=null}persist(true);render()};if(reduced){while(steps.length)tick()}else runTimer=setInterval(tick,600)}
function watch(){const updating=state.run.status==='Running';return `<div><div class="page-head"><div><div class="eyebrow mono">${state.run.id}</div><h2>Watch run</h2><p>${updating?'Studio is processing the bounded free preview.':'The preview is ready for review.'}</p></div>${statusChip(state.run.status)}</div><div class="metrics"><div class="metric"><span>Progress</span><b>${state.run.progress}%</b></div><div class="metric"><span>Workers complete</span><b>${state.run.workers.filter(w=>w.status==='Completed').length}/${state.run.workers.length}</b></div><div class="metric"><span>Records found</span><b>${state.run.records.length}</b></div><div class="metric"><span>Needs input</span><b>${state.run.needsInput||0}</b></div></div><div class="progress"><i style="width:${state.run.progress}%"></i></div><div class="run-grid section"><section class="panel browser"><div class="panel-head"><h2>Live browser</h2>${updating?'<span class="status info">Updating live</span>':''}</div>${state.ui.replay!=null?`<div class="browser-control">Replaying ${state.run.events[state.ui.replay]?.t||'00:00'}<button class="button" data-action="live">Back to live</button></div>`:''}<div class="browser-bar">https://source.example/reviewed-page</div><div class="browser-page"><div class="mock-products"><div class="mock-product"></div><div class="mock-product active"></div><div class="mock-product"></div></div></div><div class="replay">${state.run.events.map((e,i)=>`<button class="frame ${state.ui.replay===i?'active':''}" data-frame="${i}"><div class="frame-page"></div><small>${e.t} · ${e.title}</small></button>`).join('')}</div></section><aside class="panel"><div class="panel-head"><h2>Execution timeline</h2>${statusChip(state.run.status)}</div><ol class="timeline">${state.run.events.map((e,i)=>`<li class="${state.ui.replay===i?'active':''}"><i>${i<state.run.events.length-1||!updating?'✓':'•'}</i><div><b>${e.title}</b><small>${e.detail}</small></div><time>${e.t}</time></li>`).join('')}</ol></aside></div><section class="panel section"><div class="panel-head"><h2>Records found</h2>${updating?'<span class="status info">Updating live</span>':''}</div><div class="records">${state.run.records.map(r=>`<div class="record"><b>${r.name}</b><span class="muted"> · ${r.price==null?'Unknown':'€'+r.price}</span></div>`).join('')}</div></section><div class="flow-actions"><span class="muted">Free preview · ≤ ${state.workflow.limits.pages} pages · ≤ ${state.workflow.limits.minutes} min</span><button class="button" data-stage="1">Back to plan</button><button class="button primary" data-action="review" ${state.run.status==='Running'?'disabled':''}>Review data</button></div></div>`}
function resultTable(){return `<div class="table-wrap"><table><thead><tr><th>Name</th><th>Product</th><th>Price</th><th>Availability</th><th>Evidence</th></tr></thead><tbody>${state.result.records.map((r,i)=>`<tr><td>${r.name}</td><td>${r.product}</td><td>${r.price==null?'<span class="unresolved">Unknown</span>':'€'+r.price}</td><td><button class="value-button ${r.availability==='Unknown'?'unresolved':''}" data-evidence="${i}" title="Open field evidence">${r.availability}${r.manual?' · Manual · Demo User':''}</button></td><td><button class="evidence-button" data-evidence="${i}">▣ ${r.evidence} sources ›</button></td></tr>`).join('')}</tbody></table></div>`}
function evidenceDrawer(){const i=state.ui.drawer,u=state.result.unresolved.find(x=>x.record===i&&!x.resolved),r=state.result.records[i];if(i==null||!r)return'';return `<aside class="drawer open" aria-label="Evidence drawer"><div class="drawer-head"><div><div class="eyebrow">Evidence</div><h2>${r.name}</h2></div><button class="button" data-action="close-drawer" aria-label="Close evidence">Close</button></div><div class="capture"><b>Captured value</b><p>${r.availability}</p><small class="mono">source.example · 2026-10-06 14:17 UTC</small><button class="button" data-frame="1">View capture</button></div>${u?`<h3>Resolve ${u.field}</h3><p class="muted">${u.reason}</p><div class="field"><label class="field-label" for="manual-value">Enter value</label><input class="control" id="manual-value"><button class="button" data-action="manual" data-record="${i}">Apply manual value</button></div><button class="button" data-action="unknown" data-record="${i}">Accept as unknown</button> <button class="button" data-action="retry-field" data-record="${i}">Retry field</button> <button class="button" data-frame="1">Open source page</button>`:'<p class="muted">All visible values for this record are supported.</p>'}</aside>`}
function result(){const open=state.ui.drawer!=null,unresolved=state.result.unresolved.filter(x=>!x.resolved).length,total=state.result.records.length;return `<section class="panel"><div class="panel-head"><div><div class="eyebrow mono">${state.run.id}</div><h2>${total} record${total===1?'':'s'} ready</h2></div><div>${statusChip(unresolved?'Needs review':'Completed')} <span class="status warning">${unresolved} of ${total} unresolved</span></div></div><div class="tabs" role="tablist" aria-label="Result view">${['table','json','evidence'].map(t=>`<button role="tab" aria-selected="${state.ui.resultTab===t}" tabindex="${state.ui.resultTab===t?0:-1}" data-result-tab="${t}" aria-controls="result-panel">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div><div id="result-panel" role="tabpanel" class="result-layout ${open?'drawer-open':''}"><div class="result-content">${state.ui.resultTab==='table'?resultTable():state.ui.resultTab==='json'?`<pre>${escapeHtml(JSON.stringify({run_id:state.run.id,status:unresolved?'needs_review':'completed',records:state.result.records,unresolved},null,2))}</pre>`:'<div class="empty">Choose an evidence button in the table to inspect a field.</div>'}</div>${evidenceDrawer()}</div><div class="flow-actions" style="padding:18px"><span class="muted">Unresolved fields remain flagged after saving.</span><button class="button" data-stage="0">Edit and rerun</button><button class="button primary" data-action="save">Save as pipeline</button></div></section>`}
function pipelines(){return shell(`${heading('Operate','Pipelines','Saved, versioned workflows ready to run again.','<button class="button primary" data-action="new-workflow">New pipeline</button>')}<div class="panel table-wrap"><table><thead><tr><th>Pipeline</th><th>Version</th><th>Status</th><th>Schedule</th></tr></thead><tbody><tr data-go="pipeline-detail"><td>${state.saved?state.workflow.name:'Competitor prices'}</td><td>v${state.saved?state.workflow.version:4}</td><td>${statusChip('Healthy')}</td><td>On demand</td></tr><tr data-go="pipeline-detail"><td>Qualified suppliers</td><td>v2</td><td>${statusChip('Needs review')}</td><td>Weekly</td></tr></tbody></table></div>`,'Pipelines')}
function pipelineDetail(){const name=state.saved?state.workflow.name:'Competitor prices';return shell(`<a href="#pipelines">← Pipelines</a>${heading('Pipeline · v'+(state.saved?state.workflow.version:4),name,'A saved, versioned workflow.','<button class="button" data-action="schedule">Schedule</button> <button class="button primary" data-action="run-now">Run now</button>')}${state.ui.schedule?`<div class="card"><h2>Schedule</h2>${selectMarkup('schedule','On demand',['On demand','Hourly','Every 6 h','Daily','Weekly'],'Pipeline schedule')}</div>`:''}<div class="metrics"><div class="metric"><span>Status</span><b>${statusChip('Healthy')}</b></div><div class="metric"><span>Last run</span><b>18 min</b></div><div class="metric"><span>Records</span><b>3</b></div><div class="metric"><span>Version</span><b>v${state.saved?state.workflow.version:4}</b></div></div><div class="card"><h2>Plan, schema and limits</h2><p class="muted">${state.workflow.goal||'Compare competitor prices with field-level evidence.'}</p></div>`,'Pipeline detail')}
function runs(){return shell(`${heading('Operate','Runs','Every execution across saved pipelines.')}<div class="panel table-wrap"><table><thead><tr><th>Run</th><th>Pipeline</th><th>Status</th><th>Usage</th></tr></thead><tbody><tr data-go="run-detail"><td class="mono">${state.run.id}</td><td>${state.saved?state.workflow.name:'Competitor prices'}</td><td>${statusChip(state.run.status==='Queued'?'Completed':state.run.status)}</td><td>$0.18 · 42 pages</td></tr><tr data-go="run-detail"><td class="mono">run_b204</td><td>Qualified suppliers</td><td>${statusChip('Needs input')}</td><td>$0.36 · 74 pages</td></tr></tbody></table></div>`,'Runs')}
function runDetail(){const workers=state.run.intervention||(state.run.intervention=[{name:'northwind.example',status:'Completed'},{name:'summit.example',status:'Needs input'},{name:'trailshop.example',status:'Needs input'}]),needs=workers.filter(x=>x.status==='Needs input').length;return shell(`<a href="#runs">← Runs</a>${heading('Run · run_b204','Qualified suppliers','One execution of pipeline v2.')}<div class="metrics"><div class="metric"><span>Status</span><b>${statusChip(needs?'Needs input':'Completed')}</b></div><div class="metric"><span>Needs input</span><b>${needs}</b></div><div class="metric"><span>Failed</span><b>0</b></div><div class="metric"><span>Provider usage</span><b>$0.36</b></div></div><div class="panel"><div class="worker-tabs" role="tablist" aria-label="Workers">${workers.map((w,i)=>`<button role="tab" aria-selected="${state.ui.worker===i}" tabindex="${state.ui.worker===i?0:-1}" data-worker="${i}">${w.name} · ${w.status}</button>`).join('')}</div><div class="composer"><div class="run-grid"><div class="browser ${state.ui.control?'control-active':''}">${state.ui.control?'<div class="browser-control">You are in control<button class="button" data-action="handback">Hand back</button></div>':''}<div class="browser-bar">https://${workers[state.ui.worker].name}</div><div class="browser-page">${workers[state.ui.worker].status==='Needs input'?'<div class="card"><h2>Cookie preferences</h2><p>Choose which cookies this site may use.</p><button class="button">Accept all</button></div>':'<div class="empty">Worker completed successfully.</div>'}</div></div><div><h2>Worker intervention</h2><p class="muted">Resolve the selected blocked worker without losing the completed work.</p><button class="button primary" data-action="take-control">Take control</button> <button class="button" data-action="resolve-worker">Accept necessary cookies only</button> <button class="button" data-action="skip-worker">Skip this domain</button> <button class="button" data-action="handback">Hand back to agent</button></div></div><div class="flow-actions">${needs?`<button class="button primary" data-action="resolve-worker">Resolve inputs (${needs})</button>`:''}</div></div></div>`,'Run detail')}
function datasets(){return shell(`${heading('Operate','Datasets','Reviewed output from completed runs.')}<div class="panel"><div class="panel-head"><h2>Supplier research</h2>${statusChip(state.ui.datasetOpen?'Needs review':'Completed')}</div><div class="composer"><p>6 records · 2 unresolved fields</p><button class="button" data-action="dataset-detail">Review data</button>${state.ui.datasetOpen?`<div class="section">${resultTable()}${evidenceDrawer()}</div>`:''}</div></div>`,'Datasets')}
function monitors(){return shell(`${heading('Operate','Monitors','Keep saved pipelines current and review meaningful changes.','<button class="button primary" data-action="choose-pipeline">Choose a pipeline to monitor</button>')}<div class="card"><h2>Monitoring starts after a pipeline has a trusted baseline.</h2><p class="muted">Select fields, schedule and alert rules from a saved pipeline.</p></div><section class="card section"><div class="eyebrow">New monitor</div><h2>Define what counts as a meaningful change.</h2><div class="settings-grid"><label class="field-label">Saved pipeline${selectMarkup('monitorPipeline','Competitor prices · v4',['Competitor prices · v4','Qualified suppliers · v2'],'Saved pipeline')}</label><label class="field-label">Schedule${selectMarkup('monitorSchedule','Daily',['Hourly','Every 6 h','Daily','Weekly'],'Schedule')}</label><label class="field-label">Delivery${selectMarkup('monitorDelivery','In-app',['In-app','Webhook'],'Delivery')}</label></div><div class="field"><label class="field-label">Notify when</label><textarea class="control">Price changes by at least 5%, availability changes, or a requested field becomes unresolved.</textarea></div><button class="button primary" data-action="create-monitor">Create monitor</button></section><section class="panel section"><div class="panel-head"><h2>Active monitors</h2><span class="mono">Next check · 14:00 UTC</span></div><div class="table-wrap"><table><thead><tr><th>Monitor</th><th>Pipeline</th><th>Last change</th><th>Status</th></tr></thead><tbody><tr><td>Competitor price movement</td><td>Competitor prices · v4</td><td><a href="#monitor-event">€249 → €269 · 8.0%</a></td><td>${statusChip('Healthy')}</td></tr></tbody></table></div></section>`,'Monitors')}
function monitorEvent(){return shell(`<a href="#monitors">← Monitors</a>${heading('Change event','Trailhead 2P price changed','Competitor prices · v4')}<div class="compare"><div><div class="eyebrow">Previous</div><h2>€249.00</h2><p class="muted">Captured 2026-10-05 14:00 UTC</p><div class="capture">“Trailhead 2P Tent — €249.00”</div></div><div><div class="eyebrow">Current ${statusChip('Needs review')}</div><h2>€269.00</h2><p class="muted">Captured 2026-10-06 14:00 UTC</p><div class="capture">“Trailhead 2P Tent — €269.00”</div></div></div><div class="flow-actions"><span class="status warning">+8.0% change</span><button class="button primary" data-action="baseline">Accept as new baseline</button><button class="button" data-action="mute">Mute this field for 7 days</button><button class="button" data-route="run-detail">Open run</button></div>`,'Change event')}
function api(){return shell(`${heading('Developers','Developers','Connect an agent or application, confirm it works, then reuse a reviewed pipeline.')}<div class="grid-2"><section class="card"><div class="eyebrow">Connect your tool</div><h2>Use Import.io from the agent you already work in.</h2><div class="tabs" role="tablist" aria-label="Client">${['Codex','Claude','Cursor','CLI','Any agent'].map((x,i)=>`<button role="tab" aria-selected="${i===0}" tabindex="${i===0?0:-1}">${x}</button>`).join('')}</div><pre>codex mcp add importio --url https://studio.import.io/mcp \\\n+  --header "Authorization: Bearer YOUR_API_KEY"</pre><p class="muted">Every client uses the same authorization header; clients that cannot store it will prompt for your key.</p><button class="button" data-action="copy">Copy command</button> <button class="button" data-action="check">Check connection</button></section><aside class="card"><div class="eyebrow">Developer credential</div><h2>Studio API key</h2><p class="mono">YOUR_API_KEY</p><p class="muted">Illustrative only. No credential is stored.</p></aside></div>`,'Developers')}
function webhooks(){return shell(`${heading('Operate','Webhooks','Deliver completed runs and meaningful monitor changes to your systems.')}<section class="card"><h2>Add an endpoint</h2><div class="settings-grid"><label class="field-label">Endpoint URL<input class="control" value="https://api.example.com/importio/events"></label><label class="field-label">Events${selectMarkup('events','Run completed',['Run completed','Monitor changed','Input required'],'Webhook events')}</label><label class="field-label">Signing secret<input class="control mono" value="Generated after save" readonly></label></div><button class="button primary" data-action="add-webhook">Add webhook</button></section><section class="panel section"><div class="panel-head"><h2>Endpoints and recent deliveries</h2><span class="mono">Live delivery log</span></div><div class="record"><b>https://data.example.com/importio</b> ${statusChip('Healthy')}</div></section>`,'Webhooks')}
function usage(){return shell(`${heading('Operate','Usage','Operational telemetry and saved-pipeline costs.')}<div class="panel table-wrap"><table><thead><tr><th>Pipeline</th><th>Runs</th><th>Pages</th><th>Browser time</th><th>Provider cost</th></tr></thead><tbody><tr><td>Competitor prices</td><td>42</td><td>1,204</td><td>28 min</td><td>$12.84</td></tr><tr><td>Qualified suppliers</td><td>120</td><td>2,204</td><td>42 min</td><td>$24.18</td></tr></tbody></table><p class="muted" style="padding:16px">Provider cost remains estimated until every saved run reports usage. This is operational telemetry, not a billing ledger.</p></div>`,'Usage')}
const renderers={home,workflow,pipelines,pipelineDetail,runs,runDetail,datasets,enrichmentDetail:datasets,monitors,monitorEvent,api,webhooks,usage};
function render(){let fn=kinds[state.route]?workflow:renderers[state.route.replace(/-([a-z])/g,(_,c)=>c.toUpperCase())]||home;$('#app').innerHTML=fn();bindSelects();bindTabs();if(state.ui.nav)trapNav();}
function escapeHtml(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function toast(msg,undo=false){const t=$('#toast');t.className='toast';t.hidden=false;t.innerHTML=`<span>${msg}</span>${undo?'<button data-action="undo">Undo</button>':''}`;setTimeout(()=>{t.hidden=true},4500)}
function bindSelects(){$$('.custom-select').forEach(s=>{const b=$('.select-button',s);b.onclick=()=>{s.classList.toggle('open');b.setAttribute('aria-expanded',s.classList.contains('open'))};$$('[role=option]',s).forEach(o=>o.onclick=()=>{const n=s.dataset.select,v=o.dataset.value;if(n==='theme'){try{localStorage.setItem('io-theme',v)}catch{};document.documentElement.dataset.themePreference=v;document.documentElement.dataset.theme=v==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):v}else toast(`${n}: ${v}`);render()})})}
function bindTabs(){$$('[role=tablist]').forEach(list=>{const tabs=$$('[role=tab]',list);tabs.forEach((tab,i)=>{if(!tab.matches('[data-result-tab],[data-worker],[data-authoring]'))tab.onclick=()=>tabs.forEach(other=>{const selected=other===tab;other.setAttribute('aria-selected',selected);other.tabIndex=selected?0:-1});tab.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();let n=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[n].focus();tabs[n].click()}})})}
function validate(){const goal=(state.authoring==='prompt'?$('#prompt'):$('#goal'))?.value.trim()||'';const sources=state.authoring==='prompt'?state.workflow.sources:($('#sources')?.value||'').split(/\n/).map(x=>x.trim()).filter(Boolean);let ok=true;if(!goal){$('#goal-error').textContent='Describe the outcome before continuing.';ok=false}if(state.authoring==='guided'&&!sources.length){$('#sources-error').textContent='Add at least one source or choose another input.';ok=false}if(!ok)return false;state.workflow.goal=goal;state.workflow.sources=sources;state.dirty=true;if(!state.workflow.schema.length)state.workflow.schema=structuredClone(scenarios[state.scenario].schema);return true}
function navigate(route){state.route=route;state.ui.nav=false;persist();render();scrollTo({top:0,behavior:reduced?'auto':'smooth'})}
function resolveField(action,i,button){const unresolved=state.result.unresolved.find(item=>item.record===i&&!item.resolved);if(!unresolved)return;if(action==='manual'){const input=$('#manual-value'),value=input?.value.trim();if(!value){toast('Enter a value first');return}state.result.records[i].availability=value;state.result.records[i].manual=true;unresolved.resolved=true;render();return}if(action==='unknown'){unresolved.resolved=true;toast('Accepted as unknown');render();return}button.textContent='Retrying…';setTimeout(()=>{state.result.records[i].availability='Available';unresolved.resolved=true;toast('Field resolved with new evidence');render()},700)}
document.addEventListener('click',e=>{const a=e.target.closest('[data-action],[data-route],[data-start],[data-template],[data-stage],[data-result-tab],[data-evidence],[data-worker],[data-frame],[data-go],[data-input],[data-remove-field]');if(!a)return;const action=a.dataset.action;if(a.dataset.route){navigate(a.dataset.route);return}if(a.dataset.go){navigate(a.dataset.go);return}if(a.dataset.start){freshWorkflow(a.dataset.start,a.dataset.start==='extract'?'single':'single');return}if(a.dataset.template){applyScenario(a.dataset.template);return}if(a.dataset.authoring){state.authoring=a.dataset.authoring;persist(true);render();return}if(a.dataset.stage!=null){state.stage=+a.dataset.stage;persist();render();return}if(a.dataset.resultTab){state.ui.resultTab=a.dataset.resultTab;render();return}if(a.dataset.evidence!=null){state.ui.drawer=+a.dataset.evidence;state.ui.resultTab='table';render();return}if(a.dataset.worker!=null){state.ui.worker=+a.dataset.worker;render();return}if(a.dataset.frame!=null){state.ui.replay=+a.dataset.frame;render();return}if(a.dataset.input){state.inputMode=a.dataset.input;state.ui.inputsOpen=true;render();return}if(a.dataset.removeField!=null){state.workflow.schema.splice(+a.dataset.removeField,1);render();return}
 if(action==='open-nav'){state.ui.nav=true;render()}else if(action==='close-nav'){state.ui.nav=false;render()}else if(action==='new-workflow'){if(state.dirty&&state.stage<4){state.ui.discard=true;render()}else freshWorkflow()}else if(action==='discard')freshWorkflow();else if(action==='keep'){state.ui.discard=false;render()}else if(action==='inputs'){state.ui.inputsOpen=!state.ui.inputsOpen;render()}else if(action==='example')applyScenario('prompt');else if(action==='plan'&&validate()){state.stage=1;state.workflow.name=scenarios[state.scenario].name;persist();render()}else if(action==='run'){seedRun();state.stage=2;persist();render();advanceRun()}else if(action==='review'){state.stage=3;persist();render()}else if(action==='save'){state.saved=true;state.workflow.version=1;toast("Pipeline saved: "+state.workflow.name+" · v1");persist(true);openDeploy()}else if(action==='undo'&&previousDraft){state.workflow=previousDraft;state.dirty=true;previousDraft=null;persist(true);render()}else if(action==='close-drawer'){state.ui.drawer=null;render()}else if(['unknown','manual','retry-field'].includes(action)){resolveField(action,+a.dataset.record,a)}else if(action==='live'){state.ui.replay=null;render()}else if(action==='add-field'){state.workflow.schema.push(['new_field','text',false,true]);render()}else if(action==='review-dataset'){ensureDataset();state.ui.datasetOpen=true;state.ui.drawer=0;navigate('datasets')}else if(action==='dataset-detail'){ensureDataset();state.ui.datasetOpen=true;state.ui.drawer=0;render()}else if(action==='reconnect'){openModal('Reconnect browser profile','This local mock simulates re-authenticating the saved retailer browser profile.','Reconnect')}else if(action==='schedule'){state.ui.schedule=!state.ui.schedule;render()}else if(action==='run-now'){state.run={...state.run,id:'run_'+Math.random().toString(36).slice(2,6),status:'Queued'};navigate('run-detail')}else if(action==='take-control'){state.ui.control=true;render()}else if(action==='handback'){state.ui.control=false;render()}else if(action==='resolve-worker'||action==='skip-worker'){const workers=state.run.intervention||(state.run.intervention=[{name:'northwind.example',status:'Completed'},{name:'summit.example',status:'Needs input'},{name:'trailshop.example',status:'Needs input'}]);const worker=workers[state.ui.worker];if(worker&&worker.status==='Needs input'){worker.status=action==='skip-worker'?'Paused':'Running';toast(action==='skip-worker'?'Domain skipped':'Worker resumed');setTimeout(()=>{worker.status='Completed';persist(true);toast('Worker completed');render()},650);persist(true);render()}}else if(action==='baseline')toast('New baseline accepted') ;else if(action==='mute')toast('Field muted for 7 days');else if(action==='create-monitor')toast('Monitor created as a local mock');else if(action==='choose-pipeline')toast('Choose a saved pipeline below');else if(action==='copy'){navigator.clipboard?.writeText('codex mcp add importio --url https://studio.import.io/mcp --header "Authorization: Bearer YOUR_API_KEY"');toast('Command copied')}else if(action==='check')toast('Connection verified locally');else if(action==='add-webhook')toast('Webhook added as a local mock');});
document.addEventListener('input',e=>{if(['sources','goal','prompt'].includes(e.target.id)){state.dirty=true;if(e.target.id==='sources')state.workflow.sources=e.target.value.split(/\n/).map(x=>x.trim()).filter(Boolean);else state.workflow.goal=e.target.value;persist(true)}if(e.target.id==='workflow-name'){state.workflow.name=e.target.value;persist(true)}if(e.target.id==='page-cap'){state.workflow.limits.pages=+e.target.value;persist(true)}if(e.target.id==='time-cap'){state.workflow.limits.minutes=+e.target.value;persist(true)}});
document.addEventListener('change',e=>{if(e.target.id==='csv'&&e.target.files[0]){const fr=new FileReader();fr.onload=()=>{const rows=String(fr.result).trim().split(/\r?\n/),heads=rows[0].split(',');const col=heads.findIndex(x=>/url|domain/i.test(x));if(col<0)return $('#csv-info').textContent='No URL or domain column found.';state.workflow.sources=rows.slice(1).map(r=>r.split(',')[col]?.trim()).filter(Boolean);state.dirty=true;$('#csv-info').textContent=`${state.workflow.sources.length} inputs mapped from ${heads[col]}`;persist(true)};fr.readAsText(e.target.files[0])}});
function openModal(title,text,cta){const d=$('#modal');d.innerHTML=`<div class="modal-inner"><div class="dialog-head"><div><div class="eyebrow">Local mock</div><h2>${title}</h2></div><button class="button" data-close-modal>Close</button></div><p class="muted">${text}</p><button class="button primary" data-close-modal>${cta}</button></div>`;d.showModal();$$('[data-close-modal]',d).forEach(b=>b.onclick=()=>d.close())}
function openDeploy(){const slug=(state.workflow.name||'new-pipeline').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const d=$('#modal');d.innerHTML=`<div class="modal-inner"><div class="dialog-head"><div><div class="eyebrow">Pipeline saved · v${state.workflow.version}</div><h2>Deploy ${escapeHtml(state.workflow.name)}</h2></div><button class="button" data-close-modal>Close</button></div><p class="muted">Use the saved pipeline from Studio, API or MCP. This concept does not create a live deployment.</p><div class="tabs" role="tablist" aria-label="Deploy options"><button role="tab" aria-selected="true" tabindex="0">Studio</button><button role="tab" aria-selected="false" tabindex="-1">API</button><button role="tab" aria-selected="false" tabindex="-1">MCP</button></div><pre>pipe_${slug}</pre><button class="button primary" data-close-modal>Done</button></div>`;d.showModal();bindTabs();$$('[data-close-modal]',d).forEach(b=>b.onclick=()=>d.close())}
function trapNav(){const rail=$('.rail'),focusable=$$('a,button',rail);focusable[0]?.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.ui.drawer!=null){state.ui.drawer=null;render()}else if(state.ui.nav){state.ui.nav=false;render()}else $('#modal')?.close()}if(state.ui.nav&&e.key==='Tab'){const f=$$('a,button',$('.rail')),first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('hashchange',()=>{parseHash();render()});
parseHash();render();
})();
</script>
