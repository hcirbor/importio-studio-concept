name: Studio quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - name: Check out Studio
        uses: actions/checkout@v7.0.1
        with:
          path: Import Studio

      - name: Check out Import.io design system
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ vars.DESIGN_SYSTEM_REPOSITORY || 'hcirbor/importio-design-system' }}
          ref: ac9e379164dcfdd6c6b2711c073466af756a937a
          path: Import.io design system

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Import.io design system/package-lock.json
            Import Studio/studio-next/package-lock.json

      - name: Build Import.io design system
        run: |
          cd "Import.io design system"
          npm ci
          npm run build

      - name: Install dependencies
        run: |
          cd "Import Studio/studio-next"
          npm ci

      - name: Lint
        run: npm --prefix "Import Studio/studio-next" run lint

      - name: Quality baseline
        run: npm --prefix "Import Studio/studio-next" run lint:quality

      - name: Typecheck
        run: npm --prefix "Import Studio/studio-next" run typecheck

      - name: Build
        run: npm --prefix "Import Studio/studio-next" run build

      - name: Unit tests
        run: npm --prefix "Import Studio/studio-next" run test:unit

      - name: End-to-end tests
        run: npm --prefix "Import Studio/studio-next" run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Import Studio/studio-next/playwright-report
          if-no-files-found: ignore
